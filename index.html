<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal DIENN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#14213d; --ink-2:#4a5672; --ink-3:#8790a5;
    --canvas:#eceff3; --surface:#ffffff; --rule:#dde2ea; --rule-2:#eef1f5;
    --nav:#14213d; --nav-ink:#b9c2d6; --accent:#2a55d0; --accent-soft:#e6ecfb;
    --c-ext:#0f7b5f; --c-des:#2a55d0; --c-esp:#c48a12; --c-ins:#c2413a; --c-pen:#b3b9c6;
    --ok:#0f7b5f; --warn:#a8720a; --bad:#c2413a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a{color:var(--accent)}

  /* Estructura */
  .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  aside{background:var(--nav);color:var(--nav-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  aside .marca{color:#fff;font-weight:600;font-size:15px;padding:0 10px 2px}
  aside .ciclo{font-size:12px;padding:0 10px 18px;color:var(--nav-ink)}
  aside .grupo{font-size:12px;color:#7d89a6;padding:14px 10px 4px}
  aside button.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--nav-ink)}
  aside button.nav:hover{color:#fff;background:rgba(255,255,255,.06)}
  aside button.nav.on{color:#fff;background:rgba(255,255,255,.11)}
  aside button.nav .cnt{font-size:12px;color:#7d89a6}
  aside .pie{margin-top:auto;padding-top:16px;font-size:12px;display:flex;flex-direction:column;gap:8px;padding-left:10px;padding-right:10px}
  aside .pie .correo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .pie button{all:unset;cursor:pointer;color:#fff;background:rgba(255,255,255,.09);padding:8px 10px;border-radius:6px;text-align:center}
  aside .pie button:hover{background:rgba(255,255,255,.16)}
  #estadoGuardado{min-height:16px}
  .demo{background:#fff4dc;color:#6d4a00;padding:9px 32px;font-size:13px;border-bottom:1px solid #f0dfb5}
  main{padding:28px 32px 64px;max-width:1240px;width:100%}
  @media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .grupo,aside .ciclo{display:none}aside .pie{margin:0;flex-direction:row}main{padding:20px 16px 48px}}

  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
  .sub{color:var(--ink-2);margin:0 0 24px}
  h2{font-size:17px;font-weight:600;margin:0 0 4px}
  h2 + .nota-h{color:var(--ink-3);font-size:13px;margin:0 0 14px}
  .panel{background:var(--surface);border-radius:10px;padding:22px 24px;margin-bottom:18px;border:1px solid var(--rule)}

  /* Indicadores: una sola franja dividida, no tarjetas sueltas */
  .franja{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin-bottom:18px}
  .franja > div{padding:18px 22px;border-left:1px solid var(--rule)}
  .franja > div:first-child{border-left:0}
  .franja .v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .franja .v small{font-size:16px;color:var(--ink-3);font-weight:500}
  .franja .l{color:var(--ink-2);font-size:13px;margin-top:4px}
  @media(max-width:860px){.franja{grid-template-columns:1fr 1fr}.franja > div:nth-child(3){border-left:0}.franja > div:nth-child(n+3){border-top:1px solid var(--rule)}}

  /* Distribución por categoría */
  .banda{display:flex;height:44px;border-radius:7px;overflow:hidden;background:var(--rule-2);gap:2px}
  .banda > div{display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;min-width:0}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:16px}
  .cats .k{display:flex;gap:10px;align-items:baseline}
  .cats .sw{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(-1px)}
  .cats .n{font-size:22px;font-weight:600}
  .cats .t{color:var(--ink-2);font-size:13px}
  .pend{color:var(--ink-3);font-size:13px;margin-top:12px}
  @media(max-width:700px){.cats{grid-template-columns:1fr 1fr}}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--rule)}
  td{padding:12px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;white-space:nowrap}
  tr.clic{cursor:pointer} tr.clic:hover td{background:#f7f9fc}
  .quien{display:flex;gap:12px;align-items:center}
  .quien b{font-weight:600;display:block}
  .quien span{color:var(--ink-3);font-size:12.5px}

  .cat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
  .cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--c-pen))}
  .cat-Extraordinario{--c:var(--c-ext)}.cat-Destacado{--c:var(--c-des)}.cat-Esperado{--c:var(--c-esp)}.cat-Insuficiente{--c:var(--c-ins)}.cat-Pendiente,.cat-Sin{--c:var(--c-pen);color:var(--ink-3)}

  /* Retratos */
  .av{border-radius:50%;background:#d9dfe9 center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);flex:none}
  .av.s{width:34px;height:34px;font-size:12px}
  .av.m{width:84px;height:84px;font-size:24px}
  .av.l{width:120px;height:120px;font-size:34px}
  .anillo{padding:3px;border-radius:50%;background:var(--c,var(--c-pen));display:inline-flex}
  .anillo .av{border:3px solid var(--surface)}
  .equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-bottom:28px}
  .tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .tile:hover{border-color:#b9c4d8}
  .tile .nm{font-weight:600;margin-top:10px;line-height:1.25}
  .tile .nv{color:var(--ink-3);font-size:12.5px}
  .tile .st{font-size:12.5px;margin-top:6px}
  .seccion{font-size:15px;font-weight:600;margin:4px 0 12px;display:flex;gap:10px;align-items:baseline}
  .seccion span{color:var(--ink-3);font-weight:400;font-size:13px}

  /* Perfil */
  .perfil{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .perfil .foto{position:relative}
  .perfil .foto button{position:absolute;right:-4px;bottom:-4px;background:var(--surface);border:1px solid var(--rule);border-radius:99px;font-size:12px;padding:4px 9px;cursor:pointer}
  .perfil h1{margin:0}
  .perfil .meta{color:var(--ink-2)}
  .perfil .cifras{margin-left:auto;display:flex;gap:30px}
  .perfil .cifras .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .perfil .cifras .l{color:var(--ink-2);font-size:13px}
  .pestanas{display:flex;gap:24px;border-bottom:1px solid var(--rule);margin:22px 0 20px}
  .pestanas button{all:unset;cursor:pointer;padding:10px 0;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .pestanas button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
  .pestanas .der{margin-left:auto;display:flex;gap:8px;align-items:center}

  .rubro{display:grid;grid-template-columns:minmax(180px,1.3fr) 2fr 112px;gap:6px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-2)}
  .rubro:last-child{border-bottom:0}
  .rubro .nm{font-weight:500}
  .rubro .nm span{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400}
  .barras{display:flex;flex-direction:column;gap:5px}
  .track{position:relative;height:8px;border-radius:4px;background:var(--rule-2)}
  .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .track .meta{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:1px}
  .rubro .vals{text-align:right;font-size:13px;color:var(--ink-2)}
  .rubro .vals b{color:var(--ink);font-size:15px}
  .leyenda{display:flex;gap:18px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
  .leyenda i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:2px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.dos{grid-template-columns:1fr}.perfil .cifras{margin-left:0}}
  .lista-fo li{margin:0 0 8px} .lista-fo{padding-left:18px;margin:0}
  .txt{white-space:pre-wrap;line-height:1.55}
  .qa{margin-bottom:18px} .qa b{display:block;font-weight:600;margin-bottom:3px}
  .vacio{color:var(--ink-3)}

  /* Formulario de evaluación */
  .obj{border-top:1px solid var(--rule);padding:22px 0}
  .obj:first-child{border-top:0;padding-top:4px}
  .obj-h{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
  .obj-h .t{font-weight:600;font-size:15px}
  .obj-h .t span{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .obj-h .pp{color:var(--ink-2);font-size:13px;white-space:nowrap}
  .obj-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-top:12px}
  .obj-cols > div:last-child{position:sticky;top:20px;align-self:start}
  @media(max-width:900px){.obj-cols{grid-template-columns:1fr}.obj-cols > div:last-child{position:static}}
  .auto{background:#f6f8fb;border-radius:8px;padding:14px 16px;font-size:13px}
  .auto table td,.auto table th{font-size:12.5px;padding:7px 6px}
  .auto .ttl{color:var(--ink-3);font-size:12.5px;margin:12px 0 4px}
  .auto .ttl:first-child{margin-top:0}
  label.f{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0 6px}
  label.f:first-child{margin-top:0}
  input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{border:1px solid #cbd2de;border-radius:7px;padding:9px 11px;background:#fff;width:100%}
  textarea{min-height:84px;resize:vertical;line-height:1.5}
  input.nota{width:96px;font-size:20px;font-weight:600;text-align:right;padding:6px 10px}
  .fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mic{all:unset;cursor:pointer;font-size:12.5px;color:var(--accent);padding:2px 6px;border-radius:5px}
  .mic:hover{background:var(--accent-soft)}
  .mic.rec{background:var(--bad);color:#fff}
  .req{font-size:13px} .req ul{list-style:none;padding:0;margin:4px 0 14px} .req li{margin:3px 0;padding-left:20px;position:relative}
  .req li::before{position:absolute;left:0;font-weight:700}
  .req li.ok::before{content:"✓";color:var(--ok)} .req li.no::before{content:"–";color:var(--ink-3)} .req li.no{color:var(--ink-2)}
  .elegir{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .elegir button{all:unset;cursor:pointer;text-align:center;padding:11px 6px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;font-weight:500;font-size:13.5px}
  .elegir button:hover{border-color:var(--c)}
  .elegir button.on{background:var(--c);border-color:var(--c);color:#fff}
  @media(max-width:600px){.elegir{grid-template-columns:1fr 1fr}}
  .pill-na{display:inline-block;font-size:12px;color:var(--ink-2);background:var(--rule-2);border-radius:5px;padding:2px 8px}
  .chk{width:18px;height:18px;accent-color:var(--ink);cursor:pointer}
  .ia-estado{font-size:12.5px;color:var(--ink-3);margin-top:6px;min-height:16px}
  .matriz{overflow-x:auto;margin:0 -4px}
  .matriz table{min-width:640px}
  .matriz th.p{text-align:center;padding:0 4px 10px;min-width:74px;font-size:12px;line-height:1.25;color:var(--ink-2)}
  .matriz td.v{text-align:center;padding:9px 4px;font-weight:600;font-size:13px}
  .matriz td.v span{display:block;border-radius:6px;padding:6px 0}
  .matriz td.prom{text-align:center;color:var(--ink-2);font-size:13px;border-left:1px solid var(--rule)}
  .matriz tr.total td{border-top:1px solid var(--rule);font-weight:600}
  .matriz tr.catfila td{border-bottom:0;padding-top:4px}
  .matriz .catpill{display:block;border-radius:6px;padding:6px 2px;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .matriz .catpill.vacia{background:var(--rule-2);color:var(--ink-3);font-weight:500}
  .toggle{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
  .toggle button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--ink-2)}
  .toggle button.on{background:var(--ink);color:#fff}
  .sug{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:15px}
  .btn{all:unset;cursor:pointer;background:var(--ink);color:#fff;border-radius:7px;padding:10px 16px;font-weight:500;display:inline-block}
  .btn:hover{background:#22325a}
  .btn.sec{background:var(--surface);color:var(--ink);border:1px solid #cbd2de;padding:9px 15px}
  .btn.peligro{background:transparent;color:var(--bad);padding:9px 0}
  .btn[aria-disabled=true]{opacity:.5;pointer-events:none}
  .aviso{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:5px;margin:3px 6px 3px 0;background:#fff2d6;color:#7a5200}
  .aviso.ok{background:#e1f2ec;color:var(--ok)} .aviso.bad{background:#fbe3e1;color:var(--bad)}
  #drop{border:1.5px dashed #9fb0d0;border-radius:10px;background:var(--surface);padding:40px;text-align:center;cursor:pointer}
  #drop.over{background:var(--accent-soft);border-color:var(--accent)}
  .centro{max-width:400px;margin:12vh auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:32px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
  details summary{cursor:pointer;color:var(--accent);margin-top:10px;font-size:13px}
  .mejor{color:var(--ok);font-size:12.5px;font-weight:500} .peor{color:var(--bad);font-size:12.5px;font-weight:500}


  /* Vacaciones */
  :root{--vac:#1d8a73}
  .shell > div{min-width:0}
  .modal .toggle{margin-bottom:2px}
  @media(max-width:860px){aside{overflow-x:auto}}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-bottom:18px}
  .vcard{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
  .vcard:hover{border-color:#b8c3d6;box-shadow:0 2px 10px rgba(20,33,61,.06)}
  .vc-top{display:flex;gap:10px;align-items:center} .vc-top b{display:block;font-weight:600;line-height:1.25} .vc-top span:not(.av){font-size:12px;color:var(--ink-3)}
  .vc-num{display:flex;align-items:baseline;gap:8px;margin-top:6px} .vc-num b{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1} .vc-num span{color:var(--ink-2);font-size:13px}
  .vc-num.neg b,.vresumen b.neg{color:var(--bad)}
  .vc-bar{height:6px;border-radius:3px;background:#d7eee8;overflow:hidden} .vc-bar i{display:block;height:100%;background:#e0a73a;border-radius:3px}
  .vc-meta{font-size:12.5px;color:var(--ink-2)} .vc-meta b{color:var(--ink)}
  .vc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
  .vc-pie{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-3)}
  .vc-btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--accent);padding:4px 9px;border-radius:5px;background:var(--accent-soft)}
  .vc-btn:hover{background:#d5e0fa}
  .vcard.vadd{align-items:center;justify-content:center;color:var(--ink-3);border-style:dashed;min-height:150px;font:inherit;font-size:13px} .vcard.vadd span{font-size:26px;line-height:1}
  .vtag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--rule-2);color:var(--ink-2)}
  .vtag.ok{background:#e1f2ec;color:var(--ok)} .vtag.bad{background:#fbe3e1;color:var(--bad)} .vtag.warn{background:#fff2d6;color:#7a5200} .vtag.info{background:var(--accent-soft);color:var(--accent)}
  .vprox{padding:16px 20px} .vprox h2{font-size:14px;margin-bottom:10px}
  .vprox-l{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .vchip{all:unset;cursor:pointer;flex:none;border:1px solid var(--rule);border-radius:8px;padding:7px 11px;display:flex;flex-direction:column;font-size:12.5px} .vchip span{color:var(--ink-3)} .vchip:hover{border-color:#b8c3d6}
  .vnav{gap:6px} .vnav button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:6px;text-align:center;line-height:28px;border:1px solid var(--rule);font-size:16px}
  .vnav button.hoy{width:auto;padding:0 10px;font-size:12.5px} .vnav b{min-width:130px;text-align:center;text-transform:capitalize;font-weight:600}
  .leyenda .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .sw.rayas,.vcal td.v.est{background:repeating-linear-gradient(135deg,var(--vac) 0 3px,#a9d9cd 3px 6px)!important}
  .vcal-wrap{overflow-x:auto}
  .vcal{border-collapse:separate;border-spacing:0;width:auto;min-width:100%}
  .vcal th,.vcal td{padding:0;border:0;width:26px;min-width:26px;height:26px;text-align:center;font-size:11.5px;border-bottom:1px solid #fff;border-right:1px solid #fff}
  .vcal th{color:var(--ink-2);font-weight:600;vertical-align:bottom;padding-bottom:4px} .vcal th span{display:block;font-weight:400;color:var(--ink-3);font-size:10.5px}
  .vcal .n{width:auto;min-width:170px;text-align:left;padding-right:12px;white-space:nowrap;font-size:13px;position:sticky;left:0;background:var(--surface);z-index:1}
  .vcal .n a{color:var(--ink);text-decoration:none} .vcal .n a:hover{color:var(--accent)}
  .vcal tbody td{background:#fafbfc} .vcal tbody td.fs{background:#f1f3f6} .vcal tbody td.fer{background:#e3e6ec}
  .vcal tbody td.v{background:var(--vac);cursor:pointer}
  .vcal th.hoy{color:var(--accent)} .vcal td.hoy{box-shadow:inset 1px 0 var(--accent),inset -1px 0 var(--accent)}
  .vcal tbody tr:hover td.n a{color:var(--accent)}
  .vcal tfoot td{font-weight:600;color:var(--vac);padding-top:6px;background:transparent} .vcal tfoot td.n{color:var(--ink-2);font-weight:500;font-size:12.5px}
  .velo{position:fixed;inset:0;background:rgba(20,33,61,.38);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
  .modal{position:relative;background:var(--surface);border-radius:12px;padding:26px 26px 22px;width:100%;box-shadow:0 20px 50px rgba(20,33,61,.25)}
  .modal h2{font-size:19px;margin-bottom:6px;padding-right:30px}
  .modal .x{all:unset;cursor:pointer;position:absolute;top:14px;right:16px;font-size:24px;line-height:1;color:var(--ink-3)}
  .modal input[type=date]{border:1px solid #cbd2de;border-radius:7px;padding:8px 10px;background:#fff;width:100%}

function prepararDrop(drop, input, fn) {

/* ---------- Calendario del mes ---------- */
function leerVacExcel(R, hoy) {
  const h = R.findIndex(r => (r || []).some(x => limpiar(x) === "nombre"));
  if (h < 0) return null;
  const H = R[h], cNom = H.findIndex(x => limpiar(x) === "nombre"), cIng = H.findIndex(x => limpiar(x).includes("ingreso")), cIni = H.findIndex(x => limpiar(x).includes("pendiente"));
  const sem = []; H.forEach((x, j) => { if (j !== cIng && j !== cNom) { const s = serialISO(x); if (s) sem.push({ j, s }); } });
  if (sem.length < 4) return null;
  sem.sort((a, b) => a.s.localeCompare(b.s));
  let wi = -1; sem.forEach((w, i) => { if (dSum(w.s, 6) < hoy) wi = i; });
  const corte = wi >= 0 ? dSum(sem[wi].s, 6) : dSum(sem[0].s, -1);
  const R0 = VAC.reglas, personas = [], registros = [];
  for (let i = h + 1; i < R.length; i++) {
    const r = R[i] || [], nom = texto(r[cNom]).replace(/\s+/g, " ");
    if (!nom || num(nom) != null || /^total/i.test(nom)) continue;
    const abo = R[i + 1] || [], sal = R[i + 2] || [];
    const ingreso = cIng >= 0 ? serialISO(r[cIng]) : "", ini = cIni >= 0 ? num(r[cIni]) : null;
    const saldo = wi >= 0 ? (num(sal[sem[wi].j]) ?? 0) : (ini ?? 0);
    const notas = [];
    let extra = 0;
    if (ingreso) for (let k = wi; k >= 0; k--) {
      const v = num(abo[sem[k].j]); if (!(v > 0)) continue;
      const n = +sem[k].s.slice(0, 4) - +ingreso.slice(0, 4), regla = Math.min(R0.base + Math.max(0, n - 1) * R0.inc, R0.tope);
      if (n >= 1 && v < R0.tope && v !== regla && Math.abs(v - regla) <= 5) { extra = v - regla; notas.push(`Su último aniversario recibió ${v} días y la ley da ${regla}: se le reconoce ${extra > 0 ? "+" : ""}${extra} año(s) para que calce. Confírmalo con RRHH.`); }
      break;
    }
    if (!ingreso) notas.push("El Excel no tenía fecha de ingreso: complétala para que sume sus aniversarios.");
    if (ini > 0 && !saldo && sem.every(w => !num(sal[w.j]))) notas.push(`El Excel indicaba ${ini} días pendientes al inicio, pero su saldo estaba en 0. Revísalo.`);
    const p = { id: nid(), nombre: nom, ingreso, extra, saldo, corte, activo: true, nota: notas.join(" ") };
    personas.push(p);
    for (let k = wi + 1; k < sem.length; k++) {
      const v = num(r[sem[k].j]); if (!(v > 0)) continue;
      const [a, b] = bloqueHabil(sem[k].s, Math.round(v));
      registros.push({ id: nid(), pid: p.id, tipo: "vac", desde: a, hasta: b, comentario: "Venía del Excel semanal (semana del " + dTxt(sem[k].s) + ")", estimado: true });
    }
    i += 2;
  }
  return personas.length ? { personas, registros, corte } : null;
}

const ESTRUCTURA_INICIAL = [];  // la estructura se carga una sola vez con el archivo de carga inicial
/* Frentes (presentación “Reorganización DIENN por Hunting Zones”, láminas 5 y 6) */
const PROYECTOS_INICIALES = [];
async function cargarProyectosIniciales() {
  const nuevas = [], idDe = {};
  for (const [, , , ms] of PROYECTOS_INICIALES) for (const [nom] of ms) {
    if (idDe[nom]) continue;
    const ex = PERSONAS.find(p => mismaPersona(p.nombre, nom)) || nuevas.find(p => p.nombre === nom);
    if (ex) idDe[nom] = ex.id; else { const id = uuid(); nuevas.push({ id, nombre: nom, corte: dHoy() }); idDe[nom] = id; }
  }
  if (nuevas.length) await ok(sb.from("personas").insert(nuevas));
  const existentes = new Set(PROY.map(p => limpiar(p.nombre))), proys = [], miembros = [];
  PROYECTOS_INICIALES.forEach(([nombre, desc, color, ms], i) => {
    if (existentes.has(limpiar(nombre))) return;
    const id = uuid(); proys.push({ id, nombre, descripcion: desc, color, orden: PROY.length + i });
    ms.forEach(([nom, rol]) => miembros.push({ proyecto_id: id, persona_id: idDe[nom], rol }));
  });
  if (proys.length) await ok(sb.from("proyectos").insert(proys));
  if (miembros.length) await ok(sb.from("proyecto_miembros").insert(miembros));
  return { proyectos: proys.length, nuevas: nuevas.map(p => p.nombre) };
}
async function cargarSemilla(errEl) {
  errEl.textContent = "Cargando…";
  try {
    const ids = {}, nuevas = [], usadas = new Set();
    ESTRUCTURA_INICIAL.forEach(([k]) => ids[k] = uuid());
    const persona = {};
    for (const [k, , , , nom] of ESTRUCTURA_INICIAL) {
      if (!nom) continue;
      const ex = PERSONAS.find(p => !usadas.has(p.id) && mismaPersona(p.nombre, nom));
      if (ex) { persona[k] = ex.id; usadas.add(ex.id); }
      else { const id = uuid(); persona[k] = id; nuevas.push({ id, nombre: nom, corte: dHoy() }); }
    }
    if (nuevas.length) await ok(sb.from("personas").insert(nuevas));
    const filas = ESTRUCTURA_INICIAL.map(([k, cargo, nv, rep], i) => ({ id: ids[k], cargo, nivel_id: nv, reporta_a: rep ? ids[rep] : null, persona_id: persona[k] || null, orden: i }));
    const kat = persona["kr"];
    filas.find(f => f.id === ids["gc"]).encargado_id = kat || null;
    await ok(sb.from("puestos").insert(filas));
    for (const k of ["dir", "kr"]) if (persona[k]) await ok(sb.from("personas").update({ ve_estructura: true }).eq("id", persona[k]));
    let extra = "";
    if (PROYECTOS_INICIALES.length && !PROY.length) { await recargar(); const r = await cargarProyectosIniciales(); extra = ` y ${r.proyectos} frentes`; }
    recargar(`Estructura${extra} cargados${nuevas.length ? ` (${nuevas.length} personas nuevas)` : ""}`);
  } catch (e) { errEl.textContent = "No se completó: " + mensajeError(e); }
}

const aVac = p => ({ id: p.id, nombre: p.nombre, ingreso: p.ingreso || "", extra: Number(p.extra) || 0, saldo: Number(p.saldo_inicial) || 0, corte: p.corte, activo: p.activo !== false, nota: p.nota || "", correo: p.correo || "", supervisor_id: p.supervisor_id || null, admin: !!p.admin, user_id: p.user_id || null, cambiar_clave: !!p.cambiar_clave, ve_estructura: !!p.ve_estructura });
const aReg = r => ({ id: r.id, pid: r.persona_id, tipo: r.tipo, desde: r.desde, hasta: r.hasta, dias: r.dias == null ? null : Number(r.dias), comentario: r.comentario || "", estimado: !!r.estimado, suplente_id: r.suplente_id || null });

/* ---------- Calendario del equipo (solo nombres y fechas) ---------- */
async function pintarCal(el) {
  const hoy = dHoy(); VV.mes ||= hoy.slice(0, 7);
  const [y, mo] = VV.mes.split("-").map(Number), ult = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const ini = `${VV.mes}-01`, fin = `${VV.mes}-${pad2(ult)}`;
  let vacs = [];
  try { vacs = await ok(sb.rpc("vacaciones_equipo", { p_desde: ini, p_hasta: fin })) || []; } catch (e) { el.innerHTML = `<div class="err">No pude cargar el calendario: ${esc(mensajeError(e))}</div>`; return; }
  const dias = Array.from({ length: ult }, (_, i) => `${VV.mes}-${pad2(i + 1)}`);
  const filas = EQ_CAL.map(p => ({ p, v: vacs.filter(r => r.persona_id === p.id) }));
  const ocupado = (x, s) => x.v.find(r => r.desde <= s && r.hasta >= s);
  const conteo = dias.map(s => habil(s) ? filas.filter(x => ocupado(x, s)).length : null);
  const max = Math.max(1, ...conteo.filter(n => n != null)), ferMes = dias.filter(s => FER().has(s));
  el.innerHTML = `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Calendario del equipo</h2>
      <div class="fila vnav no-print"><button data-vm="-1" aria-label="Mes anterior">‹</button><b>${MESES[mo - 1]} ${y}</b><button data-vm="1" aria-label="Mes siguiente">›</button>${VV.mes !== hoy.slice(0, 7) ? `<button data-vm="0" class="hoy">Hoy</button>` : ""}</div></div>
    <div class="leyenda"><span><i class="sw" style="background:var(--vac)"></i>Vacaciones</span><span><i class="sw rayas"></i>Fechas por confirmar</span><span><i class="sw" style="background:#e3e6ec"></i>Feriado</span><span><i class="sw" style="background:#f1f3f6;border:1px solid var(--rule)"></i>Fin de semana</span></div>
    <div class="vcal-wrap"><table class="vcal"><thead><tr><th class="n"></th>${dias.map(s => { const w = dDow(s), f = FER().has(s); return `<th class="${w === 0 || w === 6 ? "fs" : ""}${f ? " fer" : ""}${s === hoy ? " hoy" : ""}" title="${f ? esc(FER().get(s)) : ""}"><span>${DIAS_C[w]}</span>${+s.slice(8)}</th>`; }).join("")}</tr></thead>
    <tbody>${filas.map(x => `<tr><td class="n">${YO && x.p.id === YO.id ? `<b>${esc(x.p.nombre)}</b>` : gestiono(x.p.id) ? `<a href="#" data-vpc="${x.p.id}">${esc(x.p.nombre)}</a>` : esc(x.p.nombre)}</td>${dias.map(s => {
      const w = dDow(s), f = FER().has(s), r = !f && w !== 0 && w !== 6 ? ocupado(x, s) : null;
      const cls = [w === 0 || w === 6 ? "fs" : "", f ? "fer" : "", s === hoy ? "hoy" : "", r ? (r.estimado ? "v est" : "v") : ""].filter(Boolean).join(" ");
      return `<td class="${cls}"${r ? ` data-cp="${x.p.id}" data-cd="${r.desde}" title="${esc(x.p.nombre)}: ${rangoTxt(r.desde, r.hasta)}${r.estimado ? " · por confirmar" : ""}${r.suplente_id ? " · lo cubre " + esc(nombreDe(r.suplente_id)) : ""}"` : f ? ` title="${esc(FER().get(s))}"` : ""}></td>`; }).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td class="n">Personas fuera</td>${conteo.map((n, i) => `<td class="${n == null ? "fs" : ""}${dias[i] === hoy ? " hoy" : ""}">${n ? `<span style="opacity:${0.45 + 0.55 * n / max}">${n}</span>` : ""}</td>`).join("")}</tr></tfoot></table></div>
    ${ferMes.length ? `<p class="pend" style="margin-top:10px">Feriados del mes: ${ferMes.map(s => `${+s.slice(8)} (${esc(FER().get(s))})`).join(" · ")}</p>` : ""}`;
  el.querySelectorAll("[data-vm]").forEach(b => b.onclick = () => {
    const k = +b.dataset.vm;
    if (k === 0) VV.mes = hoy.slice(0, 7);
    else { let [yy, mm] = VV.mes.split("-").map(Number); mm += k; if (mm < 1) { mm = 12; yy--; } if (mm > 12) { mm = 1; yy++; } VV.mes = `${yy}-${pad2(mm)}`; }

/* ---------- Historial (trazabilidad) ---------- */
function enlazarHistorial(raiz) {
  raiz.querySelectorAll("details[data-hist]").forEach(d => d.addEventListener("toggle", async () => {

      box.innerHTML = h && h.length ? `<table class="vmov">${h.map(x => `<tr><td style="width:150px;white-space:nowrap">${fechaHora(x.hecho_en)}</td><td>${esc(x.hecho_por ? nombreDe(x.hecho_por) : "Sistema")}</td><td>${describirCambio(x)}</td></tr>`).join("")}</table>` : `<p class="pend" style="margin:6px 0">Aún no hay cambios registrados.</p>`;
    } catch (e) { box.innerHTML = `<p class="err">No pude cargar el historial: ${esc(mensajeError(e))}</p>`; }
  }));

const fechaHora = s => { const d = new Date(s); return `${d.getDate()} ${MES_C[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function describirRegistro(r) {
  if (!r) return "";
  if (r.tipo === "ajuste") return `ajuste de ${Number(r.dias) > 0 ? "+" : ""}${r.dias} días${r.comentario ? ` <span style="color:var(--ink-3)">“${esc(r.comentario)}”</span>` : ""}`;
  return `vacaciones ${rangoTxt(r.desde, r.hasta)} (${nDias(diasHabiles(r.desde, r.hasta))})${r.suplente_id ? ` · cubre ${esc(primerNombre(nombreDe(r.suplente_id)))}` : ""}${r.comentario ? ` <span style="color:var(--ink-3)">“${esc(r.comentario)}”</span>` : ""}`;
}
function describirCambio(x) {
  if (x.accion === "datos") {
    const et = { ingreso: "fecha de ingreso", extra: "años reconocidos", saldo_inicial: "saldo inicial", corte: "fecha del saldo inicial" }, a = x.antes || {}, b = x.despues || {};
    return "Cambió " + Object.keys(et).filter(k => String(a[k]) !== String(b[k])).map(k => `${et[k]}: ${esc(a[k] ?? "—")} → <b>${esc(b[k] ?? "—")}</b>`).join(", ");
  }
  if (x.accion === "creó") return `Registró ${describirRegistro(x.despues)}`;
  if (x.accion === "borró") return `<span style="color:var(--bad)">Borró</span> ${describirRegistro(x.antes)}`;
  return `Cambió ${describirRegistro(x.antes)} → <b>${describirRegistro(x.despues)}</b>`;

/* ---------- Descargar en Excel (lo que tú puedes ver) ---------- */
async function exportarVac() {
  const hoy = dHoy(), gente = PERSONAS.filter(p => p.activo !== false).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const cuentas = new Map(gente.map(p => [p.id, cuentaVac(p, hoy)]));
  const lunes = s => { const w = dDow(s); return dSum(s, w === 0 ? -6 : 1 - w); };
  const inicio = lunes(gente.reduce((m, p) => p.corte && p.corte < m ? p.corte : m, hoy)), fin = dSum(lunes(hoy), 52 * 7);
  const semanas = []; for (let s = inicio; s <= fin; s = dSum(s, 7)) semanas.push(s);
  const col = s => Math.floor((dDe(s) - dDe(inicio)) / 864e5 / 7);
  const serial = s => Math.round((dDe(s) - Date.UTC(1899, 11, 30)) / 864e5);
  const A = XLSX.utils.encode_cell, ws = {}, set = (r, c, v, z) => { if (v === "" || v == null) return; ws[A({ r, c })] = typeof v === "number" ? { t: "n", v, ...(z ? { z } : {}) } : { t: "s", v: String(v) }; };
  set(0, 0, "Dir INN"); set(0, 4, `Respaldo del Portal DIENN al ${dTxt(hoy)} · por persona: fila 1 = días tomados en la semana, fila 2 = días abonados (aniversario) o ajustes, fila 3 = saldo`);
  ["Nombre", "Fecha ingreso", "Días Pendientes inicio de cuenta DIENN", "Nuevos por fecha aniversario"].forEach((h, c) => set(2, c, h));
  semanas.forEach((s, k) => set(2, 4 + k, serial(s), "d-mmm-yy"));
  let r = 3;
  for (const p of gente) {
    const c = cuentas.get(p.id), tom = new Array(semanas.length).fill(0), abo = new Array(semanas.length).fill(0);
    c.vac.filter(x => c.sinAcum || x.desde > c.corte).forEach(x => { for (let s = x.desde; s <= x.hasta; s = dSum(s, 1)) { if (!habil(s)) continue; const k = col(s); if (k >= 0 && k < semanas.length) tom[k]++; } });
    if (!c.sinAcum) {
      if (p.ingreso) { const y0 = +p.ingreso.slice(0, 4); for (let y = y0 + 1; y <= +fin.slice(0, 4); y++) { const a = aniversario(p, y); if (a > c.corte && a <= fin) { const k = col(a); if (k >= 0 && k < semanas.length) abo[k] += diasPorAnio(p, y - y0); } } }
      c.ajustes.forEach(x => { const k = Math.max(0, col(x.desde)); if (k < semanas.length) abo[k] += num(x.dias) || 0; });
    }
    set(r, 0, p.nombre); if (p.ingreso) set(r, 1, serial(p.ingreso), "m/d/yy");
    if (!c.sinAcum) { set(r, 2, num(p.saldo) || 0); set(r, 3, c.anual); } else set(r, 2, "Pasante: sin días oficiales");
    let saldo = num(p.saldo) || 0;
    semanas.forEach((s, k) => {
      if (tom[k]) set(r, 4 + k, tom[k]);
      if (abo[k]) set(r + 1, 4 + k, abo[k]);
      if (!c.sinAcum) {
        saldo += abo[k] - tom[k];
        const ant = k === 0 ? A({ r, c: 2 }) : A({ r: r + 2, c: 3 + k }), cel = A({ r: r + 2, c: 4 + k });
        ws[cel] = { t: "n", v: saldo, f: `${ant}+${A({ r: r + 1, c: 4 + k })}-${A({ r, c: 4 + k })}` };
      }
    });
    r += 3;
  }
  ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: r, c: 3 + semanas.length } });
  ws["!cols"] = [{ wch: 24 }, { wch: 11 }, { wch: 14 }, { wch: 12 }, ...semanas.map(() => ({ wch: 9 }))];
  ws["!freeze"] = { xSplit: 4, ySplit: 3 };
  const saldos = gente.map(p => { const c = cuentas.get(p.id); return { "Colaborador": p.nombre, "Puesto": (puestoDe(p.id) || {}).cargo || "", "Reporta a": (personaVac(p.supervisor_id) || {}).nombre || "", "Fecha de ingreso": p.ingreso || "",
    "Días por año": c.sinAcum ? "" : c.anual, "Saldo inicial": c.sinAcum ? "" : num(p.saldo) || 0, "Saldo inicial al": c.sinAcum ? "" : p.corte || "", "Disponibles hoy": c.sinAcum ? "Sin días oficiales" : c.saldo,
    "Tomados en el año": c.tomadosAnio, "Planificados": c.plan, "Quedan después": c.sinAcum ? "" : c.despues, "Próximo aniversario": c.prox ? c.prox.fecha : "", "Días que suma": c.prox ? c.prox.dias : "", "Alertas": c.alertas.map(a => a[1]).join(" · ") }; });
  const reg = VAC.registros.filter(x => cuentas.has(x.pid)).map(x => ({ "Colaborador": (personaVac(x.pid) || {}).nombre || "", "Tipo": x.tipo === "ajuste" ? "Ajuste" : "Vacaciones", "Desde": x.desde, "Hasta": x.tipo === "ajuste" ? "" : x.hasta,
    "Días hábiles": x.tipo === "ajuste" ? num(x.dias) : diasHabiles(x.desde, x.hasta), "Estado": x.tipo === "ajuste" ? "" : x.desde > hoy ? "Planificada" : x.hasta < hoy ? "Disfrutada" : "En curso",
    "Lo cubre": x.suplente_id ? nombreDe(x.suplente_id) : "", "Fechas por confirmar": x.estimado ? "Sí" : "", "Comentario / justificación": x.comentario || "" }))
    .sort((a, b) => a.Desde.localeCompare(b.Desde) || a.Colaborador.localeCompare(b.Colaborador));
  let hist = [];
  try { hist = (await ok(sb.from("historial").select("*").order("hecho_en", { ascending: false }).limit(5000))) || []; } catch (e) { }
  const sinHtml = h => String(h).replace(/<[^>]+>/g, "").replace(/&quot;/g, '"').replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;/g, "'");
  const histF = hist.map(x => ({ "Fecha y hora": fechaHora(x.hecho_en), "Persona": nombreDe(x.persona_id), "Hecho por": x.hecho_por ? nombreDe(x.hecho_por) : "Sistema", "Cambio": sinHtml(describirCambio(x)) }));
  const wb = XLSX.utils.book_new(), hoja = (d, w) => { const s = XLSX.utils.json_to_sheet(d.length ? d : [{ "": "Sin datos" }]); s["!cols"] = w.map(wch => ({ wch })); return s; };
  XLSX.utils.book_append_sheet(wb, ws, "VACACIONES");
  XLSX.utils.book_append_sheet(wb, hoja(saldos, [26, 30, 24, 14, 10, 11, 14, 14, 12, 12, 13, 16, 11, 40]), "Saldos");
  XLSX.utils.book_append_sheet(wb, hoja(reg, [26, 11, 12, 12, 11, 12, 22, 12, 60]), "Registro");
  XLSX.utils.book_append_sheet(wb, hoja(histF, [20, 26, 26, 90]), "Historial");
  XLSX.writeFile(wb, `Vacaciones_DIENN_respaldo_${hoy}.xlsx`);
  estado("Respaldo descargado");
}
